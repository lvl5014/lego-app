<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGO Manual - Set 30366</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f8fafc; }
    .header { background: #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #3b82f6; }
    .logo { font-weight: 800; font-size: 1.1rem; color: #3b82f6; }
    #canvas-container { width: 100%; height: 42vh; background: #1e293b; position: relative; }
    #view3d { width: 100%; height: 100%; }
    .badge-3d { position: absolute; top: 10px; left: 10px; background: rgba(15, 23, 42, 0.9); padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; border: 1px solid #334155; }
    .controls-panel { padding: 14px; background: #0f172a; min-height: 48vh; }
    .manual-header { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .set-badge { background: #dc2626; color: white; font-weight: 800; font-size: 0.8rem; padding: 3px 8px; border-radius: 6px; }
    .step-box { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .step-number-big { font-size: 1.4rem; font-weight: 900; color: #f59e0b; width: 45px; text-align: center; border-right: 2px solid #334155; margin-right: 12px; }
    .action-buttons { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-bottom: 10px; }
    .btn { background: #334155; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .btn-primary { background: #2563eb; }
    .status-text { text-align: center; font-size: 0.8rem; color: #22c55e; font-weight: 600; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div class="header">
    <div class="logo">📘 LEGO Manuel Officiel</div>
    <span id="piece-count" style="font-size: 0.85rem; color: #94a3b8;">Voiture Police</span>
  </div>

  <div id="canvas-container">
    <div class="badge-3d">🔄 Tourne avec ton doigt</div>
    <div id="view3d"></div>
  </div>

  <div class="controls-panel">
    <div class="manual-header">
      <div>
        <div style="font-weight: 700; font-size: 0.95rem;">LEGO City - Patrouille de Police</div>
        <div style="font-size: 0.75rem; color: #94a3b8;">Guide interactif 3D étape par étape</div>
      </div>
      <div class="set-badge">30366</div>
    </div>

    <div class="step-box">
      <div id="step-num-display" class="step-number-big">1</div>
      <div style="flex-grow: 1;">
        <div id="step-desc" style="font-weight: 700; font-size: 0.9rem; color: #f8fafc; margin-bottom: 2px;">Assemblage du châssis de base</div>
        <div id="layer-info" style="font-size: 0.75rem; color: #94a3b8;">Couche 1 sur 5</div>
      </div>
    </div>

    <div class="action-buttons">
      <button class="btn" onclick="etapePrecedente()">‹ Précédent</button>
      <button class="btn btn-primary" onclick="etapeSuivante()">Étape Suivante ›</button>
    </div>

    <div id="status" class="status-text">✨ Manuel officiel chargé avec succès !</div>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let currentStepIndex = 0;
    let brickObjects = [];

    // Plan exact de montage inspiré du manuel officiel LEGO City 30366
    const manualData = {
      totalPieces: 18,
      steps: [
        {
          step: 1,
          layer: 1,
          description: "Mise en place de la plaque noire de châssis et des essieux",
          bricks: [
            { size: [2, 1, 4], color: "#111827", position: [0, 0, 0] },
            { size: [1, 1, 1], color: "#1f2937", position: [-1.5, 0, 1.2] },
            { size: [1, 1, 1], color: "#1f2937", position: [1.5, 0, 1.2] }
          ]
        },
        {
          step: 2,
          layer: 2,
          description: "Ajout des briques bleues de carrosserie inférieure et des roues arrière",
          bricks: [
            { size: [2, 1, 2], color: "#2563eb", position: [0, 0, -1] },
            { size: [1, 1, 1], color: "#1f2937", position: [-1.5, 0, -1.2] },
            { size: [1, 1, 1], color: "#1f2937", position: [1.5, 0, -1.2] }
          ]
        },
        {
          step: 3,
          layer: 3,
          description: "Construction de l'habitacle et pose de la banquette blanche",
          bricks: [
            { size: [2, 1, 2], color: "#ffffff", position: [0, 1, 0] },
            { size: [1, 1, 1], color: "#e2e8f0", position: [0, 1, 0.5] }
          ]
        },
        {
          step: 4,
          layer: 4,
          description: "Installation du pare-brise transparent et du volant de conduite",
          bricks: [
            { size: [2, 1, 1], color: "#38bdf8", position: [0, 1.5, 0.8] }, // Pare-brise
            { size: [1, 1, 1], color: "#000000", position: [0, 1.5, 0.2] }  // Volant
          ]
        },
        {
          step: 5,
          layer: 5,
          description: "Finitions du capot avant et gyrophare de police bicolore",
          bricks: [
            { size: [2, 1, 1], color: "#ffffff", position: [0, 1, 1.5] }, // Capot
            { size: [1, 1, 1], color: "#dc2626", position: [-0.5, 2, 0.5] }, // Gyrophare rouge
            { size: [1, 1, 1], color: "#2563eb", position: [0.5, 2, 0.5] }  // Gyrophare bleu
          ]
        }
      ]
    };

    function init3D() {
      const container = document.getElementById('view3d');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1e293b);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(12, 10, 15);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(15, 25, 15);
      scene.add(dirLight);

      const grid = new THREE.GridHelper(20, 20, 0x475569, 0x334155);
      grid.position.y = -0.1;
      scene.add(grid);

      window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });

      afficherEtape(0);
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function createLegoBrick(size, colorHex) {
      const group = new THREE.Group();
      const unit = 0.8;
      const width = size[0] * unit;
      const height = size[1] * unit;
      const depth = size[2] * unit;

      const geometry = new THREE.BoxGeometry(width, height, depth);
      const material = new THREE.MeshStandardMaterial({ 
        color: colorHex, 
        roughness: 0.2,
        transparent: colorHex === "#38bdf8",
        opacity: colorHex === "#38bdf8" ? 0.7 : 1.0
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.y = height / 2;
      group.add(mesh);

      const edges = new THREE.EdgesGeometry(geometry);
      const wireframe = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x111111, linewidth: 2 }));
      wireframe.position.y = height / 2;
      group.add(wireframe);

      const studGeo = new THREE.CylinderGeometry(0.24 * unit, 0.24 * unit, 0.18 * unit, 16);
      const studEdgesGeo = new THREE.EdgesGeometry(studGeo);
      
      for (let x = 0; x < size[0]; x++) {
        for (let z = 0; z < size[2]; z++) {
          const stud = new THREE.Mesh(studGeo, material);
          const px = (x - (size[0] - 1) / 2) * unit;
          const py = height + (0.09 * unit);
          const pz = (z - (size[2] - 1) / 2) * unit;
          stud.position.set(px, py, pz);
          group.add(stud);

          const studWire = new THREE.LineSegments(studEdgesGeo, new THREE.LineBasicMaterial({ color: 0x111111 }));
          studWire.position.set(px, py, pz);
          group.add(studWire);
        }
      }
      return group;
    }

    function afficherEtape(stepIdx) {
      brickObjects.forEach(obj => scene.remove(obj));
      brickObjects = [];

      const unit = 0.8;
      for (let i = 0; i <= stepIdx; i++) {
        const step = manualData.steps[i];
        if (step.bricks) {
          step.bricks.forEach(b => {
            const brick = createLegoBrick(b.size, b.color);
            brick.position.set(b.position[0] * unit, b.position[1] * unit, b.position[2] * unit);
            scene.add(brick);
            brickObjects.push(brick);
          });
        }
      }

      const currentStep = manualData.steps[stepIdx];
      document.getElementById('step-num-display').innerText = (stepIdx + 1);
      document.getElementById('step-desc').innerText = currentStep.description;
      document.getElementById('layer-info').innerText = 'Étape ' + (stepIdx + 1) + ' / ' + manualData.steps.length + ' (Couche ' + currentStep.layer + ')';
    }

    function etapeSuivante() {
      if (currentStepIndex < manualData.steps.length - 1) {
        currentStepIndex++;
        afficherEtape(currentStepIndex);
      }
    }

    function etapePrecedente() {
      if (currentStepIndex > 0) {
        currentStepIndex--;
        afficherEtape(currentStepIndex);
      }
    }

    window.onload = init3D;
  </script>
</body>
</html>
