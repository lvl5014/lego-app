<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGO Gemini Vision - Instructions 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f8fafc; }
    .header { background: #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #3b82f6; }
    .logo { font-weight: 800; font-size: 1.2rem; color: #3b82f6; }
    #canvas-container { width: 100%; height: 45vh; background: #1e293b; position: relative; }
    #view3d { width: 100%; height: 100%; }
    .badge-3d { position: absolute; top: 10px; left: 10px; background: rgba(15, 23, 42, 0.9); padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; border: 1px solid #334155; }
    .controls-panel { padding: 16px; background: #0f172a; min-height: 45vh; }
    .btn-upload { background: #2563eb; color: white; padding: 14px; border-radius: 10px; display: block; font-weight: 700; cursor: pointer; text-align: center; margin-bottom: 16px; }
    input[type="file"] { display: none; }
    .step-info { background: #1e293b; padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
    .step-title { font-weight: 700; color: #f59e0b; }
    .action-buttons { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-bottom: 16px; }
    .btn { background: #334155; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .btn-primary { background: #2563eb; }
    .status-text { text-align: center; font-size: 0.9rem; color: #94a3b8; line-height: 1.4; word-break: break-word; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div class="header">
    <div class="logo">🧱 LEGO Gemini AI</div>
    <span id="piece-count" style="font-size: 0.85rem; color: #94a3b8;">0 pièce</span>
  </div>

  <div id="canvas-container">
    <div class="badge-3d">🔄 Tourne avec ton doigt</div>
    <div id="view3d"></div>
  </div>

  <div class="controls-panel">
    <label class="btn-upload">
      📸 Photographier l'objet pour ton fils
      <input type="file" id="photoInput" accept="image/*" onchange="analyserAvecGemini(event)">
    </label>

    <div class="step-info">
      <div>
        <div id="step-number" class="step-title">Étape 0 / 0</div>
        <div id="step-desc" style="font-size: 0.85rem; color: #cbd5e1;">En attente de la photo de l'objet...</div>
      </div>
      <div id="layer-badge" style="background: #0f172a; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem;">Couche -</div>
    </div>

    <div class="action-buttons">
      <button class="btn" onclick="etapePrecedente()">‹ Précédent</button>
      <button class="btn btn-primary" onclick="etapeSuivante()">Étape Suivante ›</button>
    </div>

    <div id="status" class="status-text">Prêt pour analyser un objet réel !</div>
  </div>

  <script>
    const GEMINI_API_KEY = "AQ.Ab8RN6LizKgk-QVeFYONcZZfqA3HqTa_IlsvwHLBf0bDl56LeQ";

    let scene, camera, renderer, controls;
    let legoData = null;
    let currentStepIndex = 0;
    let brickObjects = [];

    function init3D() {
      const container = document.getElementById('view3d');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1e293b);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(12, 12, 16);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(15, 25, 15);
      scene.add(dirLight);

      const grid = new THREE.GridHelper(24, 24, 0x475569, 0x334155);
      grid.position.y = -0.1;
      scene.add(grid);

      window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function createLegoBrick(size, colorHex) {
      const group = new THREE.Group();
      const unit = 0.8;
      const width = size[0] * unit;
      const height = size[1] * unit;
      const depth = size[2] * unit;

      const geometry = new THREE.BoxGeometry(width, height, depth);
      const material = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3 });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.y = height / 2;
      group.add(mesh);

      const edges = new THREE.EdgesGeometry(geometry);
      const wireframe = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x111111, linewidth: 2 }));
      wireframe.position.y = height / 2;
      group.add(wireframe);

      const studGeo = new THREE.CylinderGeometry(0.24 * unit, 0.24 * unit, 0.18 * unit, 16);
      const studEdgesGeo = new THREE.EdgesGeometry(studGeo);
      
      for (let x = 0; x < size[0]; x++) {
        for (let z = 0; z < size[2]; z++) {
          const stud = new THREE.Mesh(studGeo, material);
          const px = (x - (size[0] - 1) / 2) * unit;
          const py = height + (0.09 * unit);
          const pz = (z - (size[2] - 1) / 2) * unit;
          stud.position.set(px, py, pz);
          group.add(stud);

          const studWire = new THREE.LineSegments(studEdgesGeo, new THREE.LineBasicMaterial({ color: 0x111111 }));
          studWire.position.set(px, py, pz);
          group.add(studWire);
        }
      }
      return group;
    }

    async function resizeImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1024;
            const MAX_HEIGHT = 1024;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
              }
            } else {
              if (height > MAX_HEIGHT) {
                width *= MAX_HEIGHT / height;
                height = MAX_HEIGHT;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
            resolve(dataUrl.split(',')[1]);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function analyserAvecGemini(event) {
      const statusDiv = document.getElementById('status');
      const file = event.target.files[0];
      if (!file) return;

      statusDiv.innerHTML = "🔄 Compression et préparation de la photo...";

      try {
        const base64Data = await resizeImage(file);

        statusDiv.innerHTML = "🧠 Gemini analyse le tournevis et conçoit les briques...";

        const promptText = `Analyse cette photo de tournevis. Tu es un expert en conception de jouets LEGO pour enfants. 
Génère un plan de montage LEGO structuré en JSON strict pour recréer une version stylisée et fidèle de cet objet (manche, tige métallique).
Réponds UNIQUEMENT avec un objet JSON valide respectant exactement cette structure sans texte markdown autour :
{
  "totalPieces": 12,
  "steps": [
    {
      "step": 1,
      "layer": 1,
      "description": "Montage de la base de la poignée",
      "bricks": [
        { "type": "2x4", "color": "#DC2626", "size": [2, 1, 4], "position": [0, 0, 0] }
      ]
    }
  ]
}
Utilise des dimensions logiques pour size ([largeur, hauteur, profondeur] en plots LEGO) et des couleurs hexadécimales vibrantes (#DC2626 pour le rouge, #111827 pour le noir/métal). Divise le montage en 3 ou 4 étapes successives.`;

        // Mise à jour vers le modèle recommandé gemini-3.8-flash
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [
              {
                parts: [
                  {
                    inline_data: {
                      mime_type: "image/jpeg",
                      data: base64Data
                    }
                  },
                  { text: promptText }
                ]
              }
            ]
          })
        });

        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error.message);
        }

        const rawText = data.candidates[0].content.parts[0].text;
        const cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        legoData = JSON.parse(cleanJson);

        document.getElementById('piece-count').innerText = legoData.totalPieces + " pièces";
        statusDiv.innerHTML = "✨ Instructions LEGO générées avec succès !";
        currentStepIndex = 0;
        afficherEtape(currentStepIndex);

      } catch (err) {
        statusDiv.innerHTML = "❌ Erreur : " + err.message;
        console.error(err);
      }
    }

    function afficherEtape(stepIdx) {
      if (!legoData || !legoData.steps) return;

      brickObjects.forEach(obj => scene.remove(obj));
      brickObjects = [];

      const unit = 0.8;
      for (let i = 0; i <= stepIdx; i++) {
        const step = legoData.steps[i];
        if (step.bricks) {
          step.bricks.forEach(b => {
            const brick = createLegoBrick(b.size, b.color);
            brick.position.set(b.position[0] * unit, b.position[1] * unit, b.position[2] * unit);
            scene.add(brick);
            brickObjects.push(brick);
          });
        }
      }

      const currentStep = legoData.steps[stepIdx];
      document.getElementById('step-number').innerText = 'Étape ' + (stepIdx + 1) + ' / ' + legoData.steps.length;
      document.getElementById('step-desc').innerText = currentStep.description || "Montage en cours...";
      document.getElementById('layer-badge').innerText = 'Couche ' + (currentStep.layer || 1);
    }

    function etapeSuivante() {
      if (legoData && legoData.steps && currentStepIndex < legoData.steps.length - 1) {
        currentStepIndex++;
        afficherEtape(currentStepIndex);
      }
    }

    function etapePrecedente() {
      if (legoData && legoData.steps && currentStepIndex > 0) {
        currentStepIndex--;
        afficherEtape(currentStepIndex);
      }
    }

    window.onload = init3D;
  </script>
</body>
</html>
