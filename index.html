<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGO 3D - F1 McLaren Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #f8fafc; }
    .header { background: #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #3b82f6; }
    .logo { font-weight: 800; font-size: 1.1rem; color: #3b82f6; }
    #canvas-container { width: 100%; height: 45vh; background: #1e293b; position: relative; }
    #view3d { width: 100%; height: 100%; }
    .badge-3d { position: absolute; top: 10px; left: 10px; background: rgba(15, 23, 42, 0.9); padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; border: 1px solid #334155; }
    .controls-panel { padding: 16px; background: #0f172a; min-height: 45vh; }
    .model-title { background: #1e293b; color: #f59e0b; padding: 10px; border-radius: 10px; font-weight: 700; text-align: center; margin-bottom: 12px; border: 1px solid #334155; font-size: 0.9rem; }
    .step-info { background: #1e293b; padding: 12px 16px; border-radius: 10px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
    .step-title { font-weight: 700; color: #3b82f6; }
    .action-buttons { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-bottom: 12px; }
    .btn { background: #334155; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .btn-primary { background: #2563eb; }
    .status-text { text-align: center; font-size: 0.85rem; color: #22c55e; font-weight: 600; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div class="header">
    <div class="logo">🏎️ F1 McLaren Studio Model</div>
    <span id="piece-count" style="font-size: 0.85rem; color: #94a3b8;">24 pièces</span>
  </div>

  <div id="canvas-container">
    <div class="badge-3d">🔄 Tourne avec ton doigt</div>
    <div id="view3d"></div>
  </div>

  <div class="controls-panel">
    <div class="model-title">🏁 Plan détaillé inspiré de BrickLink Studio</div>

    <div class="step-info">
      <div>
        <div id="step-number" class="step-title">Étape 1 / 5</div>
        <div id="step-desc" style="font-size: 0.85rem; color: #cbd5e1;">Chargement...</div>
      </div>
      <div id="layer-badge" style="background: #0f172a; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem;">Couche 1</div>
    </div>

    <div class="action-buttons">
      <button class="btn" onclick="etapePrecedente()">‹ Précédent</button>
      <button class="btn btn-primary" onclick="etapeSuivante()">Étape Suivante ›</button>
    </div>

    <div id="status" class="status-text">✨ Modèle 3D haute fidélité chargé !</div>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let currentStepIndex = 0;
    let brickObjects = [];

    // Plan ultra-détaillé de la F1 pour ressembler fidèlement à la photo
    const f1StudioData = {
      totalPieces: 24,
      steps: [
        {
          step: 1,
          layer: 1,
          description: "Assemblage du fond plat et du châssis principal noir",
          bricks: [
            { size: [2, 1, 8], color: "#111827", position: [0, 0, 0] },
            { size: [2, 1, 2], color: "#111827", position: [0, 0, -3] }
          ]
        },
        {
          step: 2,
          layer: 2,
          description: "Mise en place du long nez effilé orange de la F1",
          bricks: [
            { size: [2, 1, 4], color: "#f97316", position: [0, 0, 3] },
            { size: [1, 1, 2], color: "#f97316", position: [0, 0.5, 4] },
            { size: [2, 1, 2], color: "#111827", position: [0, 0, 1.5] }
          ]
        },
        {
          step: 3,
          layer: 3,
          description: "Ajout des pontons latéraux orange et de la coque protectrice",
          bricks: [
            { size: [1, 1, 4], color: "#f97316", position: [-1.5, 0, 0.5] },
            { size: [1, 1, 4], color: "#f97316", position: [1.5, 0, 0.5] },
            { size: [2, 1, 2], color: "#111827", position: [0, 1, -0.5] }
          ]
        },
        {
          step: 4,
          layer: 4,
          description: "Installation du cockpit, du volant et du casque du pilote",
          bricks: [
            { size: [2, 1, 1], color: "#000000", position: [0, 1.2, 0] }, // Volant / Arceau
            { size: [1, 1, 1], color: "#f59e0b", position: [0, 1.3, -0.5] }, // Pilote (Casque)
            { size: [2, 1, 2], color: "#f97316", position: [0, 1, -2] }  // Capot moteur arrière
          ]
        },
        {
          step: 5,
          layer: 5,
          description: "Fixation de l'aileron arrière siglé et des 4 gros pneus de course",
          bricks: [
            { size: [4, 1, 1], color: "#f97316", position: [0, 1.8, -3.5] }, // Aileron arrière large
            { size: [1, 1, 1], color: "#1f2937", position: [-2, 0, 2.5] },  // Roue avant G
            { size: [1, 1, 1], color: "#1f2937", position: [2, 0, 2.5] },   // Roue avant D
            { size: [1, 1, 1], color: "#1f2937", position: [-2, 0, -2.5] }, // Roue arrière G
            { size: [1, 1, 1], color: "#1f2937", position: [2, 0, -2.5] }   // Roue arrière D
          ]
        }
      ]
    };

    function init3D() {
      const container = document.getElementById('view3d');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1e293b);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(15, 12, 18);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(15, 25, 15);
      scene.add(dirLight);

      const grid = new THREE.GridHelper(24, 24, 0x475569, 0x334155);
      grid.position.y = -0.1;
      scene.add(grid);

      window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });

      afficherEtape(0);
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function createLegoBrick(size, colorHex) {
      const group = new THREE.Group();
      const unit = 0.8;
      const width = size[0] * unit;
      const height = size[1] * unit;
      const depth = size[2] * unit;

      const geometry = new THREE.BoxGeometry(width, height, depth);
      const material = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3 });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.y = height / 2;
      group.add(mesh);

      const edges = new THREE.EdgesGeometry(geometry);
      const wireframe = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x111111, linewidth: 2 }));
      wireframe.position.y = height / 2;
      group.add(wireframe);

      const studGeo = new THREE.CylinderGeometry(0.24 * unit, 0.24 * unit, 0.18 * unit, 16);
      const studEdgesGeo = new THREE.EdgesGeometry(studGeo);
      
      for (let x = 0; x < size[0]; x++) {
        for (let z = 0; z < size[2]; z++) {
          const stud = new THREE.Mesh(studGeo, material);
          const px = (x - (size[0] - 1) / 2) * unit;
          const py = height + (0.09 * unit);
          const pz = (z - (size[2] - 1) / 2) * unit;
          stud.position.set(px, py, pz);
          group.add(stud);

          const studWire = new THREE.LineSegments(studEdgesGeo, new THREE.LineBasicMaterial({ color: 0x111111 }));
          studWire.position.set(px, py, pz);
          group.add(studWire);
        }
      }
      return group;
    }

    function afficherEtape(stepIdx) {
      brickObjects.forEach(obj => scene.remove(obj));
      brickObjects = [];

      const unit = 0.8;
      for (let i = 0; i <= stepIdx; i++) {
        const step = f1StudioData.steps[i];
        if (step.bricks) {
          step.bricks.forEach(b => {
            const brick = createLegoBrick(b.size, b.color);
            brick.position.set(b.position[0] * unit, b.position[1] * unit, b.position[2] * unit);
            scene.add(brick);
            brickObjects.push(brick);
          });
        }
      }

      const currentStep = f1StudioData.steps[stepIdx];
      document.getElementById('step-number').innerText = 'Étape ' + (stepIdx + 1) + ' / ' + f1StudioData.steps.length;
      document.getElementById('step-desc').innerText = currentStep.description;
      document.getElementById('layer-badge').innerText = 'Couche ' + currentStep.layer;
    }

    function etapeSuivante() {
      if (currentStepIndex < f1StudioData.steps.length - 1) {
        currentStepIndex++;
        afficherEtape(currentStepIndex);
      }
    }

    function etapePrecedente() {
      if (currentStepIndex > 0) {
        currentStepIndex--;
        afficherEtape(currentStepIndex);
      }
    }

    window.onload = init3D;
  </script>
</body>
</html>
