<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier LEGO - Reconnaissance & Studio 360°</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Barre supérieure */
    .header { background: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #f97316; }
    .logo { font-weight: 800; font-size: 1.2rem; color: #f97316; display: flex; align-items: center; gap: 8px; }
    #set-badge { background: #334155; color: #38bdf8; padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; }

    /* Zone de visualisation principale */
    .viewer-area { flex-grow: 1; background: radial-gradient(circle at center, #ffffff 0%, #e2e8f0 100%); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: grab; touch-action: none; }
    .viewer-area:active { cursor: grabbing; }
    #model-img { max-width: 85%; max-height: 85%; object-fit: contain; transition: transform 0.1s ease-out; user-select: none; filter: drop-shadow(0 20px 25px rgba(0,0,0,0.25)); }

    /* Outils flottants sur l'image */
    .toolbar { position: absolute; bottom: 16px; display: flex; gap: 10px; background: rgba(15, 23, 42, 0.85); padding: 8px 14px; border-radius: 30px; backdrop-filter: blur(4px); }
    .tool-btn { background: transparent; border: none; color: #fff; font-size: 0.85rem; font-weight: 600; cursor: pointer; padding: 4px 10px; border-radius: 15px; transition: background 0.2s; }
    .tool-btn:hover { background: rgba(255,255,255,0.15); }

    /* Panneau de contrôle bas */
    .bottom-panel { padding: 16px 20px; background: #1e293b; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #334155; }
    .panel-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn { padding: 12px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; text-align: center; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.2s; }
    .btn:active { opacity: 0.8; }
    .btn-primary { background: #0284c7; color: white; }
    .btn-secondary { background: #f97316; color: white; }
    input[type="file"] { display: none; }
    
    .status-text { text-align: center; font-size: 0.85rem; color: #22c55e; font-weight: 600; }

    /* Modale Lecteur de Notice PDF */
    #pdf-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; }
    .modal-bar { background: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0284c7; }
    .btn-close { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; }
    #pdf-frame { width: 100%; flex-grow: 1; border: none; background: #fff; }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">🧱 Atelier LEGO Studio</div>
    <div id="set-badge">Set : 60442 (McLaren F1)</div>
  </header>

  <main class="viewer-area" id="viewer">
    <!-- Image par défaut de la F1 McLaren -->
    <img src="https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?auto=format&fit=crop&w=1200&q=80" alt="Modèle LEGO" id="model-img">
    
    <div class="toolbar">
      <button class="tool-btn" onclick="miroirImage()">⇄ Retourner</button>
      <button class="tool-btn" onclick="resetVue()">↺ Réinitialiser</button>
    </div>
  </main>

  <footer class="bottom-panel">
    <div id="status-msg" class="status-text">✨ Importez une photo de set ou une image du web pour identifier le set LEGO !</div>
    <div class="panel-row">
      <label class="btn btn-secondary">
        📸 Importer une photo / Image web
        <input type="file" accept="image/*" onchange="analyserImageSet(event)">
      </label>
      <button class="btn btn-primary" onclick="ouvrirNotice()">📖 Ouvrir la Notice Officielle</button>
    </div>
  </footer>

  <!-- Fenêtre intégrée pour la notice PDF -->
  <div id="pdf-modal">
    <div class="modal-bar">
      <span id="modal-title" style="font-weight: 700;">Notice de montage officielle</span>
      <button class="btn-close" onclick="fermerNotice()">Fermer ✕</button>
    </div>
    <iframe id="pdf-frame" src=""></iframe>
  </div>

  <script>
    const imgEl = document.getElementById('model-img');
    const viewer = document.getElementById('viewer');
    const setBadge = document.getElementById('set-badge');
    const statusMsg = document.getElementById('status-msg');

    let scale = 1;
    let rotation = 0;
    let flipX = 1;
    let isDragging = false;
    let startX = 0;
    let currentSetNotice = "https://www.lego.com"; // Lien de secours

    function updateTransform() {
      imgEl.style.transform = `scale(${scale}) scaleX(${flipX}) rotate(${rotation}deg)`;
    }

    function miroirImage() {
      flipX *= -1;
      updateTransform();
    }

    function resetVue() {
      scale = 1;
      rotation = 0;
      flipX = 1;
      updateTransform();
    }

    // Zoom à la molette
    viewer.addEventListener('wheel', (e) => {
      e.preventDefault();
      scale += e.deltaY * -0.001;
      scale = Math.min(Math.max(0.5, scale), 3);
      updateTransform();
    });

    // Rotation interactive par glissement (Souris & Tactile)
    viewer.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.toolbar')) return;
      isDragging = true;
      startX = e.clientX;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      rotation += (e.clientX - startX) * 0.4;
      startX = e.clientX;
      updateTransform();
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    // Fonction d'analyse intelligente de l'image importée
    function analyserImageSet(event) {
      const file = event.target.files[0];
      if (!file) return;

      const fileName = file.name.toLowerCase();
      const reader = new FileReader();

      reader.onload = (e) => {
        imgEl.src = e.target.result;
        resetVue();

        // Détection automatique du numéro dans le nom du fichier (ex: "lego-60442.jpg" -> "60442")
        const matchNum = fileName.match(/\d{4,5}/);
        if (matchNum) {
          const setNum = matchNum[0];
          setBadge.innerText = `Set détecté : ${setNum}`;
          statusMsg.innerText = `🔍 Numéro ${setNum} reconnu avec succès ! Modèle chargé.`;
          currentSetNotice = `https://www.lego.com/fr-fr/service/buildinginstructions/${setNum}`;
        } else {
          setBadge.innerText = `Set personnalisé`;
          statusMsg.innerText = `✨ Image importée avec succès ! Vous pouvez la faire pivoter.`;
        }
      };
      reader.readAsDataURL(file);
    }

    function ouvrirNotice() {
      document.getElementById('pdf-frame').src = currentSetNotice;
      document.getElementById('pdf-modal').style.display = "flex";
    }

    function fermerNotice() {
      document.getElementById('pdf-modal').style.display = "none";
      document.getElementById('pdf-frame').src = "";
    }
  </script>
</body>
</html>
